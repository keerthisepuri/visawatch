name: VisaWatch

on:
  schedule:
    - cron: "*/5 * * * *"    # see the note on the polling loop below
    - cron: "30 3 * * *"     # 09:00 IST - daily digest
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: test-alert
        options:
          - test-alert
          - poll
          - daily

concurrency:
  group: visawatch-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@v4

      - name: Decide what this run is doing
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 3 * * *" ]; then
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          else
            echo "mode=poll" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet requests feedparser

      # Saves state.json to a one-commit "state" branch using git plumbing, so
      # it never touches the working tree, the index or the current branch. That
      # matters because it is called after every poll inside the loop below.
      - name: Write the state-saving helper
        run: |
          cat > /tmp/save-state.sh <<'HELPER'
          [ -f state.json ] || { echo "Nothing to save."; exit 0; }
          export GIT_AUTHOR_NAME="visawatch-bot"
          export GIT_AUTHOR_EMAIL="visawatch-bot@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          blob=$(git hash-object -w state.json) || exit 0
          tree=$(printf '100644 blob %s\tstate.json\n' "$blob" | git mktree) || exit 0
          commit=$(git commit-tree "$tree" -m "VisaWatch state") || exit 0
          for attempt in 1 2 3; do
            if git push --quiet --force origin "$commit:refs/heads/state"; then
              echo "State saved ($(wc -c < state.json) bytes)."
              exit 0
            fi
            sleep 5
          done
          echo "::warning::Could not save state; the next poll will retry."
          exit 0
          HELPER
          chmod +x /tmp/save-state.sh

      - name: Load what we have already seen
        if: steps.mode.outputs.mode != 'test-alert'
        run: |
          if git fetch --depth=1 origin state 2>/dev/null && \
             git show FETCH_HEAD:state.json > state.json 2>/dev/null; then
            echo "Loaded state ($(wc -c < state.json) bytes)."
          else
            echo '{}' > state.json
            echo "No saved state yet - starting fresh."
          fi

      # MEASURED 3 AUG 2026: GitHub does NOT honour the */5 schedule. Over three
      # days it fired 46 times instead of ~860 - a median gap of 74 minutes, worst
      # 227. Every run was green; GitHub was simply skipping them. With a 74-minute
      # gap almost nothing is under 15 minutes old when first seen, so every match
      # fell through to the digest and no urgent alert ever fired. That is exactly
      # why the phone stayed silent.
      #
      # The fix: stop relying on the schedule for cadence. Each run polls in a loop
      # for 55 minutes, so real polling is every 5 minutes while a run is alive,
      # and the erratic schedule only decides when a run starts.
      - name: Poll in a loop (real 5-minute cadence)
        if: steps.mode.outputs.mode == 'poll'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LOOP_MINUTES: "55"
          POLL_SECONDS: "300"
        run: |
          deadline=$(( SECONDS + LOOP_MINUTES * 60 ))
          n=0
          while [ $SECONDS -lt $deadline ]; do
            n=$(( n + 1 ))
            echo "--- poll $n ---"
            python -m visawatch poll || echo "poll failed, continuing"
            bash /tmp/save-state.sh || echo "state save failed, continuing"
            remaining=$(( deadline - SECONDS ))
            # Must be an if, not "[ ... ] && break": steps run under bash -e, so a
            # false test as the last command of the loop would fail the whole step.
            if [ "$remaining" -le 60 ]; then
              break
            fi
            if [ "$remaining" -lt "$POLL_SECONDS" ]; then
              sleep "$remaining"
            else
              sleep "$POLL_SECONDS"
            fi
          done
          echo "Completed $n polls in this run."

      - name: Run VisaWatch
        if: steps.mode.outputs.mode != 'poll'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EMAIL_TO:   ${{ secrets.EMAIL_TO }}
          SMTP_HOST:  ${{ secrets.SMTP_HOST }}
          SMTP_PORT:  ${{ secrets.SMTP_PORT }}
          SMTP_USER:  ${{ secrets.SMTP_USER }}
          SMTP_PASS:  ${{ secrets.SMTP_PASS }}
          SMTP_FROM:  ${{ secrets.SMTP_FROM }}
        run: python -m visawatch ${{ steps.mode.outputs.mode }}

      - name: Remember what we have seen
        if: always() && steps.mode.outputs.mode == 'daily'
        run: bash /tmp/save-state.sh
