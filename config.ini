# =====================================================================
#  VisaWatch configuration
#  ---------------------------------------------------------------
#  This is the ONLY file you need to edit. It is plain text.
#  Lines starting with # are notes and are ignored.
#  Lists are separated by commas. Spaces around commas are fine.
#  After editing: save the file, then commit it (see README step 9).
# =====================================================================

[you]
# Your own timezone, e.g. America/Phoenix, America/New_York, Asia/Kolkata.
#
# TWO CLOCKS MATTER HERE, and mixing them up is a real bug:
#   * Release windows are IST, because the consulates and their booking
#     systems run on India time wherever the applicant happens to be.
#   * Quiet hours are YOUR local time, because they are about your sleep.
# Alerts quote both, so you never have to do the arithmetic.
timezone = America/Phoenix

[matching]
# An alert fires only when an item matches AT LEAST ONE word from
# EACH of the three groups below. All matching ignores capitals,
# hyphens and dots (so "H-1B", "h1b" and "H.1.B" are all the same).

# Group A - the thing being talked about
group_a = slot, slots, appointment, appointments, interview

# Group B - the thing that happened to it
group_b = open, opened, available, availability, released, release, dropped, drop, bulk, live

# Group C - where. Edit this to add or remove consulates.
# The short forms matter: people posting a live slot drop type "HYD" or
# "DEL/BOM", not "Hyderabad". Without these, most real reports are missed.
group_c = Hyderabad, HYD, Delhi, New Delhi, DEL, NDL, Mumbai, Bombay, BOM, MUM,
          Kolkata, Calcutta, CCU, KOL, Chennai, Madras, MAA, CHN, India

# If an item ALSO contains any of these, it is marked HIGH PRIORITY.
boost = H1B, H-1B, H4, H-4, petition, petition-based

# Phrases that cancel a match even if the three groups hit.
# These kill the two big sources of noise: people ASKING about slots, and
# people writing up an interview they already attended.
exclude = no slots, not available, nothing available, dry run, when will slots,
          interview experience, my experience, got approved, approved same day,
          visa approved, rejected, refused, 221g, dropbox experience,
          is it possible, anyone able, can i get, can i book, please help,
          any suggestions, what are the chances, checkvisaslots

[windows]
# ---------------------------------------------------------------------
#  THE MOST USEFUL PART OF VISAWATCH
# ---------------------------------------------------------------------
# Slot batches are reported to fill within MINUTES. Reacting to an alert is a
# lottery; being logged in and refreshing when a release is likely is not.
# So VisaWatch pings you shortly BEFORE the windows where slot-drop reports
# historically cluster.
#
# The windows below are measured, not folklore. On 4 Aug 2026 I compared 346
# slot-drop posts over a year against 1,200 ordinary posts from the same
# subreddits, to cancel out "when are people simply awake and on Reddit":
#
#     06:00 IST  3.7x the normal rate   (strongest)
#     04:00 IST  1.9x
#     22:00 IST  1.5x
#
# CROSS-CHECKED 4 Aug 2026 against the objection "isn't this just when Indians
# are awake?". r/h1b is a US-based crowd (it peaks at 00:00 IST and bottoms out
# at 14:00 IST - the mirror image of the India-based subs). If the spike were
# an awake-ness artifact it would land on a different absolute hour there.
# It does not: 06:00-07:00 IST and 22:00-23:00 IST show up in BOTH crowds,
# each measured against its own baseline. That is a real release pattern,
# anchored to IST because the consulates run on India time.
#
# Day of the week showed NO pattern at all, so there is no weekday setting -
# the popular "Wednesday midnight" and "Friday batch" claims do not appear in
# a year of data.
#
# Caveat worth knowing: this measures when people POST, which lags the actual
# release. The real drop is probably slightly earlier, which is why the ping
# comes before the window opens.
enabled = yes

# Windows to watch, IST, 24-hour clock. Comma separated.
# Centred on the STRONGEST evidence (the 06:00 peak) rather than every hour
# that showed a lift.
#
# In Phoenix these land at 17:00 and 09:30 - both comfortable waking hours,
# so you get no night-time wake-ups at all. Adding 04:00-05:00 would add a
# 15:40 ping for a weaker 1.9x signal; harmless where you are, so add it if
# you want maximum coverage.
windows = 05:30-07:30, 22:00-23:00

# How many minutes before a window opens to ping you.
#
# If no GitHub run happens to be alive during that lead period, the ping is
# still sent later, any time before the window closes - the message then reads
# OPEN NOW instead. Firing late beats not firing at all.
lead_minutes = 20

# Whether a window ping may override quiet hours. Moot in Phoenix (both pings
# land mid-afternoon and mid-morning); matters if you are ever in India, where
# the morning window falls at 05:10 local.
bypass_quiet_hours = yes

[timing]
# An item is only sent as an URGENT push if it is younger than this
# many minutes the first time VisaWatch sees it. Older matches go
# into the daily digest instead.
urgent_max_age_minutes = 15

# Time of the daily digest, in India Standard Time, 24-hour clock.
digest_time_ist = 09:00

# If a source has not been read successfully for this many minutes,
# send a "source down" notice.
source_down_after_minutes = 60

# Don't repeat the same "source down" notice more often than this.
source_down_repeat_minutes = 360

# Forget seen-item IDs older than this, to keep the memory file small.
# Deduplication only has to outlast the feed window, which is hours, so
# 3 days is already generous.
forget_seen_after_days = 3

[quiet_hours]
# Quiet hours are in YOUR local time (see [you] above), not IST.
# URGENT slot alerts ALWAYS ignore quiet hours - that is the point
# of the service. Only the daily digest and source-down notices wait.
# Set enabled = no to turn quiet hours off entirely.
#
# Note for Phoenix: both release windows land at 17:00 and 09:30 your time,
# so neither ping falls in these hours anyway - the bypass switch under
# [windows] is effectively moot for you. It matters if you move to India.
enabled = yes
start = 23:00
end = 07:00

[notifications]
# Your secret ntfy topic. Invent any hard-to-guess word, subscribe to
# the same word in the ntfy phone app, and put it here.
# You can also set it as the NTFY_TOPIC secret in GitHub, which
# overrides this line (recommended, keeps it out of the code).
ntfy_topic =

# ntfy server. Leave as-is unless you self-host.
ntfy_server = https://ntfy.sh

# Priority for URGENT alerts. 5 = max, breaks through Do Not Disturb.
urgent_priority = 5

# Priority for the daily digest and source-down notices. 3 = default.
digest_priority = 3

# Optional: also email the daily digest. Leave blank to skip email.
# Requires the SMTP_* secrets described in the README.
email_to =

[sources]
# The public feeds VisaWatch reads. One per line, name = url.
# Do not add anything here that requires a login.
reddit_usvisascheduling_new = https://www.reddit.com/r/usvisascheduling/new/.rss
reddit_usvisaindians_new    = https://www.reddit.com/r/USVisaIndians/new/.rss
reddit_comments             = https://www.reddit.com/r/usvisascheduling/comments/.rss?limit=100
reddit_search               = https://www.reddit.com/search.rss?q=%28subreddit%3Ausvisascheduling+OR+subreddit%3AUSVisaIndians+OR+subreddit%3Ah1b%29+AND+%28slots+OR+bulk+OR+dropped%29&sort=new&t=day

[waittimes]
# The US State Department global visa wait times page, read once a day
# in a real browser.
#
# Currently OFF. Measured on 1 Aug 2026: the page answers HTTP 403 to the
# GitHub Actions runner even in a real headless browser, because it blocks
# data-centre IP ranges. Per your rules VisaWatch backs off rather than trying
# to disguise itself, so this simply cannot be read from here. Leaving it on
# just added a 3-minute browser install to every daily run for nothing.
# Set enabled = yes if you ever move VisaWatch to a machine it will talk to.
enabled = no
url = https://travel.state.gov/content/travel/en/us-visas/visa-information-resources/global-visa-wait-times.html

# Which rows of the table to watch. Must match the page's spelling.
posts = New Delhi, Mumbai (Bombay), Chennai (Madras), Hyderabad, Kolkata

# Which column to track. "Petition-Based" is the H/L/O/P/Q column.
column = Petition-Based
